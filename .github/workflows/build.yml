name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot 4.3 + export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configure Godot editor settings (Android SDK path)
        run: |
          APKSIGNER=$(find /usr /opt /home /root -name apksigner -type f -path '*build-tools*' 2>/dev/null | head -1)
          echo "apksigner found at: $APKSIGNER"
          SDK_DIR=$(dirname "$(dirname "$(dirname "$APKSIGNER")")")
          echo "Android SDK directory: $SDK_DIR"
          ls "$SDK_DIR/platform-tools" "$SDK_DIR/build-tools"
          godot --headless --editor --quit --path . || true
          SETTINGS=~/.config/godot/editor_settings-4.3.tres
          grep -v 'export/android/android_sdk_path' "$SETTINGS" > /tmp/es.tres || true
          echo "export/android/android_sdk_path = \"$SDK_DIR\"" >> /tmp/es.tres
          cp /tmp/es.tres "$SETTINGS"

      - name: Generate debug keystore + patch preset
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          sed -i "s|DEBUG_KEYSTORE_PATH|$HOME/debug.keystore|" export_presets.cfg

      - name: Import project
        run: godot --headless --import

      - name: Export Android APK (debug-signed test build)
        run: |
          mkdir -p build
          godot --headless --export-release "Android" "$GITHUB_WORKSPACE/build/hill-traffic-runner.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HillTrafficRunner-test-apk
          path: build/hill-traffic-runner.apk
